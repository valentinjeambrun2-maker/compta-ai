<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ComptaIA</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%237c5cff'/><text x='12' y='17' font-size='15' text-anchor='middle' fill='white' font-family='Arial'>€</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Direction artistique : continuité The Herakles (pearl / ink / violet #4b3fd6 / halo) */
:root{
  --bg:#fff;--panel:#f5f5f7;--panel-2:#fff;--ink:#1d1d1f;--ink-2:#424245;--muted:#6e6e73;--muted-2:#86868b;
  --line:#e8e8ed;--hair:#d2d2d7;--accent:#4b3fd6;--accent-hover:#3c31c2;--accent-ink:#fff;--link:#4b3fd6;--soft:#efedfd;
  --ok:#1d7a46;--warn:#b25000;--bad:#c4001a;--prod:#4b3fd6;--charge:#3bc9f5;
  --nav-bg:rgba(255,255,255,.8);--halo:linear-gradient(100deg,#7c5cff 0%,#e056c1 50%,#3bc9f5 100%);
  --sans:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --r-s:12px;--r:22px;--r-l:30px;--ease:cubic-bezier(.25,.1,.25,1);--shadow:0 2px 6px rgba(0,0,0,.04),0 12px 32px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000;--panel:#161617;--panel-2:#1d1d1f;--ink:#f5f5f7;--ink-2:#d2d2d7;--muted:#a1a1a6;--muted-2:#86868b;
  --line:#2c2c2e;--hair:#424245;--link:#a99fff;--soft:#211d3d;--ok:#4cc27e;--warn:#f0a050;--bad:#ff6b6b;--prod:#8b7dff;--charge:#3bc9f5;
  --nav-bg:rgba(22,22,23,.72);--shadow:0 2px 6px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.5)}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.47 var(--sans);letter-spacing:-.011em;-webkit-font-smoothing:antialiased}
::selection{background:var(--soft)}
/* Barre globale translucide */
header{position:sticky;top:0;z-index:20;height:52px;display:flex;align-items:center;gap:14px;padding:0 max(16px,calc((100vw - 1180px)/2));
  background:var(--nav-bg);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:17px;letter-spacing:-.02em;margin-right:auto;white-space:nowrap}
.brand .mark{width:26px;height:26px;border-radius:8px;background:var(--halo);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;box-shadow:0 4px 12px rgba(124,92,255,.35)}
.brand small{font-weight:400;color:var(--muted-2);font-size:12px;letter-spacing:0}
header select{border:0;background:transparent;font-weight:500;font-size:14px;padding:6px 4px;cursor:pointer;max-width:240px}
header select:focus{box-shadow:none}
.chip{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--panel);color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--muted-2)}.chip.on i{background:var(--ok)}
/* Sous-navigation façon apple.com */
nav{position:sticky;top:52px;z-index:15;background:var(--nav-bg);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);border-bottom:1px solid var(--line)}
nav .in{max-width:1180px;margin:0 auto;padding:8px 16px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}nav .in::-webkit-scrollbar{display:none}
nav button{flex:none;background:none;border:0;padding:7px 14px;border-radius:99px;color:var(--ink-2);cursor:pointer;font:inherit;font-size:13.5px;transition:background .2s var(--ease),color .2s}
nav button:hover{background:var(--panel)}nav button.on{background:var(--ink);color:var(--bg);font-weight:500}
main{max-width:1180px;margin:0 auto;padding:0 16px 120px;position:relative;overflow-x:clip}
/* Hero de section */
.hero{position:relative;padding:56px 0 32px}
.hero::before{content:"";position:absolute;right:-6%;top:-10%;width:520px;height:340px;max-width:70vw;background:var(--halo);filter:blur(90px);opacity:.16;border-radius:50%;pointer-events:none;z-index:-1}
.eyebrow{color:var(--muted);font-weight:600;font-size:14px;margin:0 0 10px;letter-spacing:-.005em}
.hero h1{font-size:clamp(2.4rem,1.6rem + 3.2vw,4rem);line-height:1.04;letter-spacing:-.04em;font-weight:700;margin:0}
.hero p.lead{font-size:clamp(1.1rem,1rem + .5vw,1.35rem);color:var(--muted);max-width:720px;margin:14px 0 0;letter-spacing:-.015em}
/* Cartes */
.card{background:var(--panel);border-radius:var(--r-l);padding:clamp(20px,3vw,32px);margin-bottom:20px}
.card .card{background:var(--panel-2);border-radius:var(--r);box-shadow:var(--shadow)}
.card h2{font-size:clamp(1.3rem,1.1rem + .7vw,1.7rem);letter-spacing:-.03em;font-weight:700;margin:0 0 16px;line-height:1.15}
.card h3{font-size:17px;letter-spacing:-.02em;font-weight:600;margin:22px 0 10px}
.card > .eb{color:var(--link);font-weight:500;font-size:14px;margin-bottom:6px}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.grid > .card{margin-bottom:0;min-width:0}
.kpis{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
td:first-child{white-space:nowrap}
input[type=file]{padding:6px;min-height:44px}input[type=file]::file-selector-button{font:inherit;font-size:14px;border:0;border-radius:999px;padding:7px 16px;margin-right:12px;background:var(--soft);color:var(--link);cursor:pointer}
.grid + .card,.card + .grid{margin-top:20px}
.kpi .l{color:var(--muted);font-size:13px;font-weight:500;margin-bottom:6px}
.kpi .v{font-size:clamp(1.45rem,1.2rem + .8vw,1.85rem);white-space:nowrap;font-weight:700;letter-spacing:-.035em;font-variant-numeric:tabular-nums;line-height:1.1}
/* Tableaux */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--muted-2);font-weight:500;font-size:12px;text-transform:none;letter-spacing:0}
tr:last-child td{border-bottom:0}td.n,th.n{text-align:right}.scroll{overflow-x:auto;margin:0 -6px;padding:0 6px}
/* Formulaires */
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--panel-2);border:1px solid var(--hair);border-radius:var(--r-s);padding:10px 12px;max-width:100%;min-height:44px;transition:border-color .2s,box-shadow .2s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--soft)}
textarea{width:100%;min-height:120px;resize:vertical}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--muted)}
.form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));align-items:end}
/* Boutons pilule */
button.b,button.g,a.g{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 22px;border-radius:999px;font:inherit;font-size:15px;cursor:pointer;text-decoration:none;transition:background .2s var(--ease),transform .15s var(--ease),border-color .2s}
button.b{background:var(--accent);color:#fff;border:1px solid transparent;font-weight:500}
button.b:hover{background:var(--accent-hover)}button.b:active,button.g:active{transform:scale(.97)}
button.g,a.g{background:transparent;color:var(--link);border:1px solid var(--hair)}
button.g:hover,a.g:hover{border-color:var(--link)}
button.g.small{min-height:32px;padding:4px 12px;font-size:13px}
.lnk{background:none;border:0;color:var(--link);font:inherit;cursor:pointer;padding:0}.lnk::after{content:" ›"}#userBtn::after{content:""}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.muted{color:var(--muted)}.small{font-size:13px}
details summary{cursor:pointer;color:var(--link);margin-top:18px;list-style:none}details summary::before{content:"✦ "}
details[open] summary{margin-bottom:10px}
code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--panel-2);padding:2px 6px;border-radius:6px}
pre{white-space:pre-wrap;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
/* Alertes */
.al{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:16px;margin:8px 0;background:var(--panel-2);font-size:14.5px}
.al::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--muted-2)}
.al.critique::before{background:var(--bad)}.al.attention::before{background:var(--warn)}.al.info::before{background:var(--accent)}.al.ok::before{background:var(--ok)}
.card .card .al{background:var(--panel)}
.conf{display:inline-block;width:44px;height:5px;border-radius:3px;background:var(--line);vertical-align:middle;overflow:hidden;margin-right:6px}.conf i{display:block;height:100%;border-radius:3px}
/* Assistant */
.chat{display:flex;flex-direction:column;gap:10px;max-height:480px;overflow:auto;margin-bottom:16px;padding:4px}
.msg{padding:11px 16px;border-radius:20px;white-space:pre-wrap;max-width:80%;font-size:15px;line-height:1.45}
.msg.u{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:6px}
.msg.a{background:var(--panel-2);border-bottom-left-radius:6px;box-shadow:var(--shadow)}
.fab{position:fixed;right:20px;bottom:20px;z-index:30;display:flex;align-items:center;gap:10px;padding:7px 18px 7px 7px;border-radius:999px;border:1px solid var(--line);
  background:var(--nav-bg);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);box-shadow:var(--shadow);color:var(--ink);font:inherit;font-size:15px;cursor:pointer;transition:transform .2s var(--ease)}
.fab:hover{transform:translateY(-2px)}.fab span{width:38px;height:38px;border-radius:50%;background:var(--halo);display:grid;place-items:center;color:#fff;font-size:17px;box-shadow:0 0 18px rgba(224,86,193,.45)}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:rgba(29,29,31,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#f5f5f7;padding:12px 20px;border-radius:999px;display:none;z-index:40;max-width:90vw;font-size:14px;box-shadow:var(--shadow)}
.legend{display:flex;gap:18px;font-size:13px;color:var(--muted);margin-bottom:8px}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.hidden{display:none}ol{padding-left:20px}ol li{margin:6px 0}
body.ro button.b:not(.calc),body.ro .wr{display:none!important}
.user{position:relative}.menu{position:absolute;right:0;top:40px;background:var(--panel-2);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:8px;min-width:230px;z-index:50}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:10px;font:inherit;color:var(--ink);cursor:pointer}.menu button:hover{background:var(--panel)}
.menu .who{padding:8px 12px 10px;border-bottom:1px solid var(--line);margin-bottom:6px;font-size:13px}.menu .who b{display:block;font-size:14px}
.login{max-width:420px;margin:0 auto}.login .card{padding:32px}
.drop{border:1.5px dashed var(--hair);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);cursor:pointer;transition:border-color .2s,background .2s;background:var(--panel-2)}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--soft);color:var(--link)}.drop b{color:var(--link);font-weight:500}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--panel-2);color:var(--muted)}.tag.ok{color:var(--ok)}.tag.bad{color:var(--bad)}.tag.warn{color:var(--warn)}.tag.acc{color:var(--link);background:var(--soft)}
.seg{display:inline-flex;background:var(--panel-2);border-radius:99px;padding:3px;gap:2px;margin-bottom:18px}.seg button{border:0;background:none;padding:7px 16px;border-radius:99px;font:inherit;font-size:14px;color:var(--ink-2);cursor:pointer}.seg button.on{background:var(--ink);color:var(--bg)}
.big{font-size:clamp(2.2rem,1.6rem + 2vw,3.2rem)!important}
/* Accueil : tous les outils */
.hub{display:flex;flex-direction:column;gap:30px;margin-bottom:40px}
.hub-h{font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 12px}
.hub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tool{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:18px;cursor:pointer;color:var(--ink);font:inherit;box-shadow:var(--shadow);transition:transform .2s var(--ease),border-color .2s}
.tool:hover{transform:translateY(-2px);border-color:var(--c)}
.tool:focus-visible{outline:2px solid var(--c);outline-offset:3px}
.tool-ico{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.tool-t{display:flex;flex-direction:column;gap:4px;min-width:0}
.tool-t b{font-weight:600;font-size:15.5px;line-height:1.3}
.tool-t .small{line-height:1.4}
.navlabel{align-self:center;font-size:13.5px;color:var(--muted);padding:0 10px}
@media (max-width:640px){.brand small,.chip,.brand .txt{display:none}header{gap:4px}header select{max-width:46vw;font-size:13px}header .lnk{font-size:13px}header .lnk::after{content:""}header #newBtn{font-size:0}header #newBtn::before{content:"+";font-size:18px}.kpis{grid-template-columns:1fr 1fr;gap:12px}.kpis .card{padding:16px;border-radius:22px}.kpi .v{font-size:1.25rem}.kpi .l{font-size:12px}.card{border-radius:24px}.hero{padding:36px 0 24px}.fab b{display:none}.fab{padding:7px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="mark">€</span><span class="txt">ComptaIA</span> <small>par The Herakles</small></div>
  <select id="ent" aria-label="Dossier"></select>
  <select id="year" aria-label="Exercice"></select>
  <button class="lnk small" id="newBtn" onclick="newEntity()" style="white-space:nowrap" aria-label="Nouveau dossier">+ Dossier</button>
  <span id="iaBadge" class="chip"></span>
  <div class="user"><button class="lnk small" id="userBtn" onclick="toggleMenu()" style="white-space:nowrap"></button><div class="menu hidden" id="menu"></div></div>
</header>
<nav><div class="in" id="nav"></div></nav>
<main><section class="hero" id="hero"></section><div id="agent"></div><div id="view"></div></main>
<button class="fab" onclick="TAB='ai';render();scrollTo({top:0,behavior:'smooth'})" aria-label="Demander à l'IA"><span>✦</span><b style="font-weight:400">Demander à l'IA</b></button>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
let ENT=null, ENTS=[], YEAR=new Date().getFullYear(), TAB='hub';
const fmt=v=>(v==null?'—':Number(v).toLocaleString('fr-FR',{style:'currency',currency:'EUR'}));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3500)}
let ME=null, ROLE=null;
async function api(path,body,method){
  const r=await fetch(path,{method:method||(body?'POST':'GET'),credentials:'same-origin',headers:{'Content-Type':'application/json','X-Entity':ENT?.id||0},body:body?JSON.stringify(body):undefined});
  const ct=r.headers.get('content-type')||'';const d=ct.includes('json')?await r.json():await r.text();
  if(r.status==401){showLogin();throw new Error('auth')}
  if(!r.ok){toast('⚠ '+(d.error||d));throw new Error(d.error||d)}return d}
async function fetchBlob(path){const r=await fetch(path,{credentials:'same-origin',headers:{'X-Entity':ENT?.id||0}});
  if(!r.ok){const d=await r.json().catch(()=>({}));toast('⚠ '+(d.error||'Téléchargement impossible'));throw new Error('dl')}
  const cd=r.headers.get('content-disposition')||'';return {blob:await r.blob(),name:(cd.match(/filename="([^"]+)"/)||[])[1]||'export'}}
async function download(path){const {blob,name}=await fetchBlob(path);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
async function openFile(path){const w=window.open('','_blank');const {blob}=await fetchBlob(path);const u=URL.createObjectURL(blob);if(w)w.location=u;else location.href=u}
const readB64=f=>new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=ko;r.readAsDataURL(f)});
function dropZone(id,label,onfile,accept='.pdf,image/*'){return `<label class="drop wr" id="${id}" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')"
  ondrop="event.preventDefault();this.classList.remove('over');${onfile}(event.dataTransfer.files[0])"><input type="file" accept="${accept}" class="hidden" onchange="${onfile}(this.files[0])">✦ ${label}<br><span class="small">Glissez un <b>PDF</b> ou une <b>photo</b>, ou cliquez pour choisir</span></label>`}
const today=()=>new Date().toISOString().slice(0,10);
const exportBtns=(kind)=>`<span class="row"><button class="g small" onclick="download('/api/export/pdf/${kind}?year=${YEAR}')">PDF</button><button class="g small" onclick="download('/api/export/xlsx/${kind}?year=${YEAR}')">Excel</button></span>`;
var TABS={entreprise:[['dash','Tableau de bord'],['bank','Banque & IA'],['inv','Factures'],['quotes','Devis'],['ndf','Notes de frais'],['pay','Paie'],['jrn','Écritures'],['rep','États financiers'],['tva','TVA'],['tax','Impôts & liasse'],['ai','Assistant IA'],['close','Clôture & exports'],['set','Paramètres']],
 particulier:[['dash','Tableau de bord'],['bank','Banque & IA'],['jrn','Écritures'],['rep','Budget'],['tax','Déclaration de revenus'],['ai','Assistant IA'],['close','Exports'],['set','Paramètres']]};

async function init(){
  for(let y=YEAR+1;y>=YEAR-4;y--)$('#year').insertAdjacentHTML('beforeend',`<option ${y==YEAR?'selected':''}>${y}</option>`);
  $('#year').onchange=e=>{YEAR=+e.target.value;render()};
  $('#ent').onchange=e=>{ENT=ENTS.find(x=>x.id==e.target.value);ROLE=ENT.role;try{localStorage.setItem('ent',ENT.id)}catch{};TAB='hub';render()};
  document.addEventListener('click',e=>{if(!e.target.closest('.user'))$('#menu').classList.add('hidden')});
  const st=await api('/api/auth/state');
  if(st.setup_needed)return showSetup();
  if(!st.user)return showLogin();
  setUser(st.user);await loadEnts();
}
function setUser(u){ME=u;$('#userBtn').textContent=u?u.name.split(' ')[0]+' ▾':'';['#ent','#year','#newBtn','#iaBadge','#userBtn'].forEach(s=>$(s).classList.toggle('hidden',!u))}
function toggleMenu(){const m=$('#menu');m.classList.toggle('hidden');m.innerHTML=`<div class="who"><b>${esc(ME.name)}</b>${esc(ME.email)}${ROLE?`<br><span class="tag acc" style="margin-top:6px">${ROLE}</span>`:''}</div>
  <button onclick="TAB='set';render();toggleMenu()">Paramètres et membres</button><button onclick="pwdForm()">Changer de mot de passe</button><button onclick="logout()">Se déconnecter</button>`}
function authShell(title,lead,inner){$('#nav').innerHTML='';$('#view').innerHTML='';setUser(null);$('.fab').style.display='none';
  $('#hero').innerHTML=`<div class="login"><p class="eyebrow">ComptaIA</p><h1>${title}</h1><p class="lead">${lead}</p><div class="card" style="margin-top:28px">${inner}</div></div>`}
function showLogin(){authShell('Bon retour.','Connectez-vous pour accéder à vos dossiers.',`<div class="form" style="grid-template-columns:1fr">
  <label>E-mail<input id="lE" type="email" autocomplete="username"></label><label>Mot de passe<input id="lP" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')doLogin()"></label>
  <button class="b calc" onclick="doLogin()">Se connecter</button></div>`);setTimeout(()=>$('#lE')?.focus(),50)}
function showSetup(){authShell('Bienvenue.','Créez le compte administrateur de cette installation.',`<div class="form" style="grid-template-columns:1fr">
  <label>Nom<input id="sN" autocomplete="name"></label><label>E-mail<input id="sE" type="email" autocomplete="username"></label>
  <label>Mot de passe (8 caractères minimum)<input id="sP" type="password" autocomplete="new-password"></label><button class="b calc" onclick="doSetup()">Créer mon compte</button></div>`)}
async function doLogin(){const r=await api('/api/auth/login',{email:$('#lE').value,password:$('#lP').value});setUser(r.user);$('.fab').style.display='';await loadEnts()}
async function doSetup(){const r=await api('/api/auth/setup',{name:$('#sN').value,email:$('#sE').value,password:$('#sP').value});setUser(r.user);$('.fab').style.display='';await loadEnts()}

// ---------- Tableau de bord ----------
async function dash(){
  const d=await api(`/api/dashboard?year=${YEAR}`);const c=d.context;
  $('#iaBadge').className='chip'+(d.ia?' on':'');$('#iaBadge').innerHTML=`<i></i>${d.ia?'Claude connecté':'IA locale'}`;
  const max=Math.max(1,...d.mois.flatMap(m=>[m.produits,m.charges]));const W=1080,H=220,bw=W/12;
  const bars=d.mois.map((m,i)=>{const hp=m.produits/max*(H-20),hc=m.charges/max*(H-20);
    return `<rect x="${i*bw+bw/2-26}" y="${H-hp}" width="24" height="${hp}" rx="6" fill="var(--prod)"><title>${fmt(m.produits)}</title></rect>
    <rect x="${i*bw+bw/2+2}" y="${H-hc}" width="24" height="${hc}" rx="6" fill="var(--charge)"><title>${fmt(m.charges)}</title></rect>
    <text x="${i*bw+bw/2}" y="${H+18}" font-size="13" text-anchor="middle" fill="var(--muted)">${'JFMAMJJASOND'[i]}</text>`}).join('');
  const isP=ENT.kind=='particulier';
  $('#view').innerHTML=`<div class="grid kpis">
   <div class="card kpi"><div class="l">${isP?'Revenus':'Produits'} ${YEAR}</div><div class="v">${fmt(c.produits)}</div></div>
   <div class="card kpi"><div class="l">${isP?'Dépenses':'Charges'} ${YEAR}</div><div class="v">${fmt(c.charges)}</div></div>
   <div class="card kpi"><div class="l">${isP?'Épargne nette':'Résultat'}</div><div class="v" style="color:${c.resultat<0?'var(--bad)':'var(--ok)'}">${fmt(c.resultat)}</div></div>
   <div class="card kpi"><div class="l">Trésorerie</div><div class="v">${fmt(c.tresorerie)}</div></div>
   ${c.tva?`<div class="card kpi"><div class="l">TVA nette ${YEAR}</div><div class="v">${fmt(c.tva.a_payer||-c.tva.credit)}</div></div>`:''}
   <div class="card kpi"><div class="l">Impôt estimé</div><div class="v" style="font-size:17px;white-space:normal;letter-spacing:-.02em">${esc(c.impot_estime)}</div></div></div>
  <div class="card"><h2>Évolution mensuelle</h2><div class="legend"><span><i style="background:var(--prod)"></i>${isP?'Revenus':'Produits'}</span><span><i style="background:var(--charge)"></i>${isP?'Dépenses':'Charges'}</span></div>
   <svg viewBox="0 0 ${W} ${H+24}" style="width:100%;height:auto;display:block">${bars}</svg></div>
  <div class="card"><h2>Revue automatique (audit IA)</h2>${d.alertes.map(a=>`<div class="al ${a.niveau}">${esc(a.message)}</div>`).join('')}</div>`;
}

// ---------- Banque ----------
let ACCS=[];
async function bank(){
  ACCS=await api('/api/accounts');const st=window._bst||'pending';const tx=await api('/api/bank?status='+st);
  const opts=a=>ACCS.map(x=>`<option value="${x.code}" ${x.code==a?'selected':''}>${x.code} ${esc(x.label)}</option>`).join('');
  const tvaSel=(id,r)=>ENT.kind=='entreprise'?`<select id="r${id}">${[0,2.1,5.5,10,20].map(v=>`<option ${v==r?'selected':''}>${v}</option>`).join('')}</select>`:'';
  $('#view').innerHTML=`<div class="card"><h2>Importer un relevé bancaire (CSV)</h2>
   <p class="muted small">Colonnes reconnues automatiquement : Date, Libellé, Montant — ou Débit/Crédit. Séparateur ; , ou tabulation. Les doublons sont ignorés et chaque ligne est catégorisée par l'IA puis lettrée avec vos factures ouvertes.</p>
   <div class="row"><input type="file" id="csvf" accept=".csv,.txt"><button class="b" onclick="importCsv()">Importer & catégoriser</button></div></div>
  <div class="card"><div class="row" style="justify-content:space-between"><h2>Opérations ${st=='pending'?'à valider':'validées'} (${tx.length})</h2>
   <div class="row"><button class="g" onclick="window._bst='${st=='pending'?'validated':'pending'}';bank()">Voir ${st=='pending'?'validées':'à valider'}</button>
   ${st=='pending'?`<button class="b" onclick="valAll()">Valider tout ≥ 80 % de confiance</button>`:''}</div></div>
   <div class="scroll"><table><tr><th>Date</th><th>Libellé</th><th class="n">Montant</th><th>Compte proposé</th>${ENT.kind=='entreprise'?'<th>TVA %</th>':''}<th>Confiance</th><th></th></tr>
   ${tx.map(t=>`<tr><td>${t.date}</td><td>${esc(t.label)}<div class="small muted">${esc(t.reason||'')}</div></td><td class="n" style="color:${t.amount<0?'var(--bad)':'var(--ok)'}">${fmt(t.amount)}</td>
   <td>${st=='pending'?`<select id="a${t.id}" style="max-width:240px">${opts(t.account)}</select>`:esc(t.account)}</td>${ENT.kind=='entreprise'?`<td>${st=='pending'?tvaSel(t.id,t.tva_rate):t.tva_rate}</td>`:''}
   <td style="white-space:nowrap"><span class="conf"><i style="width:${(t.confidence||0)*100}%;background:${t.confidence>=.8?'var(--ok)':t.confidence>=.5?'var(--warn)':'var(--bad)'}"></i></span> ${Math.round((t.confidence||0)*100)} %</td>
   <td>${st=='pending'?`<button class="g" onclick="val(${t.id})">Valider</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">Aucune opération.</td></tr>'}</table></div></div>`;
}
// Relevés bancaires français : souvent en Windows-1252 (accents), parfois en UTF-8.
async function readCsvText(f){const b=await f.arrayBuffer();try{return new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(e){return new TextDecoder('windows-1252').decode(b)}}
async function importCsv(){const f=$('#csvf').files[0];if(!f)return toast('Choisissez un fichier');const r=await api('/api/bank/import',{csv:await readCsvText(f)});toast(`${r.imported} importée(s) · ${r.rules_applied} classée(s) par vos règles · ${r.possible_duplicates} doublon(s) probable(s) à vérifier · ${r.duplicates} ignorée(s)`);bank()}
async function val(id){const r=$('#r'+id);await api(`/api/bank/${id}/validate`,{account:$('#a'+id).value,tva_rate:r?+r.value:0});toast('Écriture passée');bank()}
async function valAll(){const r=await api('/api/bank/validate-confident',{min_conf:.8});toast(`${r.validated} opération(s) comptabilisée(s)`);bank()}

   <div class="scroll"><table><tr><th>Facture</th><th>Client</th><th class="n">TTC</th><th>Retard</th><th>Dernière</th><th>E-mail</th><th></th></tr>

function addLine(l={}){$('#iL').insertAdjacentHTML('beforeend',`<div class="form il" style="margin-bottom:8px"><label>Désignation<input class="lL" value="${esc(l.label||'')}"></label><label>Qté<input class="lQ" type="number" step="any" value="${l.qty||1}"></label><label>PU HT (€)<input class="lU" type="number" step="0.01" value="${l.unit_price||''}"></label><label>TVA %<select class="lR">${[20,10,5.5,2.1,0].map(v=>`<option ${v==(l.tva_rate??20)?'selected':''}>${v}</option>`).join('')}</select></label></div>`)}
async function saveInv(){const lines=[...document.querySelectorAll('.il')].map(d=>({label:d.querySelector('.lL').value,qty:+d.querySelector('.lQ').value,unit_price:+d.querySelector('.lU').value,tva_rate:+d.querySelector('.lR').value})).filter(l=>l.unit_price);
  await api('/api/invoices',{kind:$('#iK').value,party:$('#iP').value||'—',date:$('#iD').value,number:$('#iN').value||null,account:$('#iA').value||null,nature:$('#iNat').value,email:$('#iEm').value||null,lines});toast('Facture enregistrée et comptabilisée');inv()}
async function readInvFile(f){if(!f)return;$('#invDrop').innerHTML='Lecture du document en cours…';
  try{const d=await api('/api/documents/read',{data:await readB64(f),mime:f.type,filename:f.name});fillInv(d);toast('Facture lue ('+d.source+') — vérifiez avant d\'enregistrer')}
  catch(e){}finally{$('#invDrop').innerHTML='✦ Importer une autre facture<br><span class="small">PDF ou photo</span>'}}
function fillInv(d){$('#iK').value='purchase';$('#iP').value=d.party||'';if(d.date)$('#iD').value=d.date;$('#iN').value=d.number||'';$('#iL').innerHTML='';(d.lines||[]).forEach(addLine)}
async function extractInv(){const d=await api('/api/invoices/extract',{text:$('#iT').value});$('#iK').value='purchase';$('#iP').value=d.party||'';if(d.date)$('#iD').value=d.date;$('#iN').value=d.number||'';$('#iL').innerHTML='';(d.lines||[]).forEach(addLine);toast('Champs extraits ('+(d.source=='ia'?'IA':'règles')+') — vérifiez avant d\'enregistrer')}
async function payInv(id){await api(`/api/invoices/${id}/pay`,{date:new Date().toISOString().slice(0,10)});toast('Règlement comptabilisé');inv()}
async function sendRem(id){const r=await api(`/api/reminders/${id}/send`,{email:$('#rem'+id).value});showMail(r,'#remOut');if(r.sent)inv()}
async function autoRem(){const r=await api('/api/reminders/auto',{});toast(r.length?`${r.length} relance(s) traitée(s)`:'Aucune relance due (vérifiez les e-mails clients)');inv()}
function showMail(r,sel){toast(r.message);if(!r.sent&&r.subject)$(sel).innerHTML=`<div class="card" style="margin-top:14px"><h3>${esc(r.subject)}</h3><div class="al attention">${esc(r.message)}</div><pre style="color:var(--ink)">${esc(r.body)}</pre></div>`}

// ---------- Écritures ----------
async function jrn(){
  const page=await api(`/api/entries?start=${YEAR}-01-01&end=${YEAR}-12-31&limit=${window._jrnLimit||200}`);const list=page.items;ACCS=await api('/api/accounts');
  const opts=ACCS.map(x=>`<option value="${x.code}">${x.code} ${esc(x.label)}</option>`).join('');
  $('#view').innerHTML=`<div class="card"><h2>Saisie d'une écriture (opérations diverses)</h2><div class="form"><label>Date<input type="date" id="jD" value="${new Date().toISOString().slice(0,10)}"></label><label>Journal<select id="jJ"><option>OD</option><option>BQ</option><option>AC</option><option>VE</option><option>AN</option></select></label><label>Libellé<input id="jL"></label></div>
   <div id="jLines"></div><p class="row"><button class="g" onclick="jAdd()">+ Ligne</button><button class="b" onclick="jSave()">Enregistrer</button><span id="jBal" class="muted small"></span></p></div>
  <div class="card"><h2>Journal ${YEAR} (${list.length} sur ${page.nombre} écritures)</h2><div class="scroll"><table><tr><th>Date</th><th>Jnl</th><th>Libellé</th><th>Compte</th><th class="n">Débit</th><th class="n">Crédit</th><th></th></tr>
  ${list.map(e=>e.lines.map((l,i)=>`<tr${i?'':' style="border-top:2px solid var(--line)"'}><td>${i?'':e.date}</td><td>${i?'':e.journal}</td><td>${i?'':esc(e.label)}</td><td>${l.account}</td><td class="n">${l.debit?fmt(l.debit):''}</td><td class="n">${l.credit?fmt(l.credit):''}</td><td>${i?'':(e.reversed_by?'<span class="tag">annulée</span>':e.reversal_of?'<span class="tag">contre-passation</span>':e.facture?'<span class="tag" title="Écriture liée à une facture : à annuler depuis la facture">facture</span>':e.lettree?'<span class="tag" title="Écriture lettrée : délettrer avant annulation">lettrée</span>':`<button class="g small" onclick="jCancel(${e.id})">Annuler</button>`)}</td></tr>`).join('')).join('')}</table></div>${page.nombre>list.length?`<p><button class="g small" onclick="jMore()">Afficher plus (${page.nombre-list.length} restantes)</button></p>`:''}</div>`;
  window._opts=opts;jAdd();jAdd();
}
function jAdd(){$('#jLines').insertAdjacentHTML('beforeend',`<div class="form jl" style="margin-top:8px"><label>Compte<select class="jA">${window._opts}</select></label><label>Débit<input class="jDb" type="number" step="0.01" oninput="jBal()"></label><label>Crédit<input class="jCr" type="number" step="0.01" oninput="jBal()"></label></div>`)}
function jBal(){let d=0,c=0;document.querySelectorAll('.jl').forEach(r=>{d+=+r.querySelector('.jDb').value||0;c+=+r.querySelector('.jCr').value||0});$('#jBal').textContent=`Débit ${fmt(d)} · Crédit ${fmt(c)} ${Math.abs(d-c)<.005&&d?'✓ équilibrée':'— non équilibrée'}`}
async function jSave(){const lines=[...document.querySelectorAll('.jl')].map(r=>({account:r.querySelector('.jA').value,debit:r.querySelector('.jDb').value||0,credit:r.querySelector('.jCr').value||0})).filter(l=>+l.debit||+l.credit);
  await api('/api/entries',{date:$('#jD').value,journal:$('#jJ').value,label:$('#jL').value||'Écriture',lines});toast('Écriture enregistrée');jrn()}
// Une écriture n'est jamais effacée : on la contre-passe (même montant en sens inverse, daté d'aujourd'hui).
async function jCancel(id){if(!confirm('Annuler cette écriture ? Une contre-passation datée d\'aujourd\'hui sera passée. L\'écriture reste visible dans le journal.'))return;await api(`/api/entries/${id}/cancel`,{});toast('Écriture annulée par contre-passation');jrn()}

  $('#view').innerHTML=`${isBlock}${liasseBlock}${foncierBlock}<div class="card"><h2>${isP?'Déclaration de revenus (2042) — pré-remplie par l\'IA':'Impôt sur le revenu du dirigeant (2042)'}</h2>

async function microCalc(){const r=await api('/api/tax/micro',{ca:+$('#mCa').value,activite:$('#mAct').value,vl:!!$('#mVl').value});$('#mOut').innerHTML=`<div class="grid" style="margin-top:12px">${[['Cotisations URSSAF',r.cotisations_urssaf],['Versement libératoire',r.versement_liberatoire],['Revenu imposable (après abattement)',r.revenu_imposable_micro],['Net avant IR',r.net_avant_ir]].map(([l,v])=>`<div class="kpi"><div class="l">${l}</div><div class="v">${fmt(v)}</div></div>`).join('')}</div><p class="muted small">${esc(r.note)}</p>`}

   <h3>Cases à reporter sur impots.gouv.fr</h3><table><tr><th>Case</th><th class="n">Montant</th></tr>${Object.entries(c.cases_2042).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${fmt(v)}</td></tr>`).join('')}</table>
   ${c.notes.map(n=>`<div class="al info">${esc(n)}</div>`).join('')}<p class="muted small">Barème ${c.annee_revenus} paramétré dans <code>compta/tax.py</code> — numéros de cases indicatifs, à vérifier sur le formulaire officiel.</p>

async function declare(type,period,json){
  const r=await api('/api/declarations',{type,period,data:JSON.parse(json),submit:true});
  const lab={deposee:'déposée ✓',transmise:'transmise au partenaire',simulee:'simulée (mode test) ✓',prete:'prête à déposer'}[r.status]||'erreurs';
  const tgt=document.querySelectorAll('#declOut');const box=tgt[tgt.length-1];
  box.innerHTML=`<div class="card" style="margin-top:12px"><h3>Déclaration n° ${r.id} — ${lab}</h3>${r.edi?`<div class="al ${r.edi.status=='accepte'?'ok':'critique'}">EDI (${esc(r.edi.ref||'—')}) : ${esc(r.edi.message||r.edi.status)}</div>`:''}

}

async function liasseCalc(){
  const rein={},ded={};if(+$('#lA').value)rein['Amendes et pénalités']=+$('#lA').value;if(+$('#lS').value)rein['Charges non déductibles']=+$('#lS').value;if(+$('#lD').value)ded['Déductions diverses']=+$('#lD').value;
  const L=await api('/api/liasse',{year:YEAR,reintegrations:rein,deductions:ded});window._liasse=L;
  const t=(rows)=>`<div class="scroll"><table>${rows.map(x=>`<tr><td style="width:60px" class="muted">${x.ligne}</td><td>${esc(x.libelle)}</td><td class="n">${fmt(x.montant)}</td></tr>`).join('')}</table></div>`;
  const rf=L.resultat_fiscal;
  $('#lOut').innerHTML=`<div class="grid" style="margin-top:18px"><div class="card"><h3 style="margin-top:0">2033-A · Actif</h3>${t(L['2033A_actif'])}</div><div class="card"><h3 style="margin-top:0">2033-A · Passif</h3>${t(L['2033A_passif'])}
   <p class="small">${L.equilibre?'<span class="tag ok">Bilan équilibré</span>':'<span class="tag bad">Bilan déséquilibré</span>'}</p></div></div>
   <div class="card"><h3 style="margin-top:0">2033-B · Compte de résultat</h3>${t(L['2033B'].filter(x=>x.montant||['232','264','270','310'].includes(x.ligne)))}</div>
   <div class="grid"><div class="card"><h3 style="margin-top:0">Résultat fiscal</h3><table><tr><td>Résultat comptable</td><td class="n">${fmt(rf.resultat_comptable)}</td></tr>
   ${Object.entries(rf.reintegrations).map(([k,v])=>`<tr><td>+ ${esc(k)}</td><td class="n">${fmt(v)}</td></tr>`).join('')}${Object.entries(rf.deductions).map(([k,v])=>`<tr><td>− ${esc(k)}</td><td class="n">${fmt(v)}</td></tr>`).join('')}
   <tr><td><b>370 Bénéfice fiscal</b></td><td class="n"><b>${fmt(rf['370 Résultat fiscal — bénéfice'])}</b></td></tr><tr><td>372 Déficit</td><td class="n">${fmt(rf['372 Résultat fiscal — déficit'])}</td></tr></table></div>
   <div class="card"><h3 style="margin-top:0">2065 · Impôt sur les sociétés</h3><table>${Object.entries(L['2065']).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${typeof v=='number'?fmt(v):esc(v)}</td></tr>`).join('')}</table></div></div>
   ${(L.controles||[]).map(x=>`<div class="al ${x.niveau=='attention'?'attention':'info'}"><div style="flex:1">${esc(x.message)}</div>${x.action=='corriger_is'?`<button class="b small" onclick="isCorrect()">Reclasser l'IS</button>`:''}</div>`).join('')}
   <div class="al info">${esc(L.avertissement)}</div>
   <p class="row"><button class="b" onclick="declLiasse()">Transmettre la liasse (EDI-TDFC)</button></p><div id="declOut"></div>`}

   <h3>Lignes</h3><div id="iL"></div><p class="row"><button class="g" onclick="addLine()">+ Ligne</button><button class="b" onclick="saveQuote()">Créer le devis</button></p></div>
  <div class="card"><h2>Devis</h2><div class="scroll"><table><tr><th>N°</th><th>Date</th><th>Client</th><th class="n">TTC</th><th>Validité</th><th>Statut</th><th></th></tr>
  ${list.map(q=>`<tr><td>${esc(q.number)}</td><td>${q.date}</td><td>${esc(q.party)}</td><td class="n">${fmt(q.ttc)}</td><td>${q.valid_until}</td><td><span class="tag ${st[q.status]||''}">${q.status=='facture'?'facturé':q.status}</span></td>
  <td class="row"><button class="g small" onclick="openFile('/api/quotes/${q.id}/pdf')">PDF</button>${q.status!='facture'?`<button class="g small wr" onclick="sendQuote(${q.id})">Envoyer</button>
   <select class="wr" style="min-height:32px;padding:4px 8px;font-size:13px" onchange="api('/api/quotes/${q.id}/status',{status:this.value}).then(quotes)"><option value="">Statut…</option><option value="accepte">Accepté</option><option value="refuse">Refusé</option><option value="envoye">Envoyé</option></select>
   <button class="b wr" style="min-height:32px;padding:4px 14px;font-size:13px" onclick="q2inv(${q.id})">Facturer</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">Aucun devis.</td></tr>'}</table></div><div id="qOut"></div></div>`;
  addLine();
}
async function saveQuote(){const lines=[...document.querySelectorAll('.il')].map(d=>({label:d.querySelector('.lL').value,qty:+d.querySelector('.lQ').value,unit_price:+d.querySelector('.lU').value,tva_rate:+d.querySelector('.lR').value})).filter(l=>l.unit_price);
  await api('/api/quotes',{party:$('#qP').value||'—',email:$('#qE').value||null,date:$('#qD').value,validity_days:+$('#qV').value,lines});toast('Devis créé');quotes()}
async function sendQuote(id){const r=await api(`/api/quotes/${id}/send`,{});toast(r.message);if(r.sent)quotes()}
async function q2inv(id){if(!confirm('Transformer ce devis en facture (comptabilisée) ?'))return;await api(`/api/quotes/${id}/invoice`,{date:today()});toast('Facture créée et comptabilisée');TAB='inv';render()}

// ---------- Notes de frais ----------
const CATS=[['restaurant','Restaurant / repas d\'affaires'],['carburant','Carburant'],['transport','Train, avion, taxi'],['hebergement','Hôtel'],['peage_parking','Péage / parking'],['fournitures','Fournitures'],['logiciel','Logiciel / abonnement'],['telecom','Téléphone / internet'],['cadeau','Cadeau client'],['autre','Autre']];
async function ndf(){
  const list=await api('/api/expenses');window._ndfFile=null;
  const lab={a_valider:['à valider','warn'],validee:['validée','acc'],remboursee:['remboursée','ok']};
  const tot=list.filter(x=>x.status=='validee').reduce((s,x)=>s+x.ttc,0);
  $('#view').innerHTML=`<div class="card wr"><div class="seg"><button class="on" id="sgT" onclick="ndfMode(0)">Dépense</button><button id="sgK" onclick="ndfMode(1)">Kilomètres</button></div>
   <div id="ndfT">${dropZone('ndfDrop','Ajouter le justificatif (ticket, facture)','readReceipt')}
   <div class="form" style="margin-top:16px"><label>Date<input type="date" id="xD" value="${today()}"></label><label>Personne<input id="xP" value="${esc(ME?.name?.split(' ')[0]||'')}"></label>
   <label>Libellé<input id="xL"></label><label>Catégorie<select id="xC" onchange="$('#xR').value={restaurant:10,carburant:20,transport:0,hebergement:0,peage_parking:20,fournitures:20,logiciel:20,telecom:20,cadeau:20,autre:20}[this.value]">${CATS.map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></label>
   <label>Montant TTC (€)<input id="xT" type="number" step="0.01"></label><label>Taux de TVA récupérable (%)<select id="xR">${[20,10,5.5,2.1,0].map(v=>`<option ${v==10?'selected':''}>${v}</option>`).join('')}</select></label></div></div>
   <div id="ndfK" class="hidden"><div class="form"><label>Date<input type="date" id="kD" value="${today()}"></label><label>Personne<input id="kP" value="${esc(ME?.name?.split(' ')[0]||'')}"></label>
   <label>Trajet<input id="kL" placeholder="Lyon → Grenoble, RDV client"></label><label>Distance (km)<input id="kK" type="number"></label>
   <label>Puissance fiscale<select id="kC">${[3,4,5,6,7].map(v=>`<option value="${v}" ${v==5?'selected':''}>${v} CV${v==7?' et +':''}</option>`).join('')}</select></label></div>
   <p class="muted small">Barème kilométrique officiel (tranche jusqu'à 5 000 km/an). Pas de TVA récupérable sur les indemnités kilométriques.</p></div>
   <p><button class="b" onclick="saveNdf()">Ajouter la note de frais</button></p>
   <p class="muted small">TVA non récupérable appliquée automatiquement sur le transport de personnes et l'hébergement. Carburant : TVA récupérable à 80 % pour un véhicule de tourisme (ajustez le taux si besoin).</p></div>
  <div class="card"><div class="row" style="justify-content:space-between"><h2>Notes de frais</h2>${tot?`<button class="b" onclick="reimburse()">Rembourser ${fmt(tot)}</button>`:''}</div>
   <div class="scroll"><table><tr><th>Date</th><th>Personne</th><th>Libellé</th><th class="n">TTC</th><th>TVA</th><th>Statut</th><th></th></tr>
   ${list.map(x=>`<tr><td>${x.date}</td><td>${esc(x.person||'')}</td><td>${esc(x.label)}${x.km?` <span class="small muted">${x.km} km · ${x.cv} CV</span>`:''}</td><td class="n">${fmt(x.ttc)}</td><td>${x.tva_rate?x.tva_rate+' %':'—'}</td>
   <td><span class="tag ${lab[x.status][1]}">${lab[x.status][0]}</span></td><td class="row">${x.has_file?`<button class="g small" onclick="openFile('/api/expenses/${x.id}/file')">Justificatif</button>`:''}${x.status=='a_valider'?`<button class="g small wr" onclick="api('/api/expenses/${x.id}/validate',{}).then(()=>{toast('Note validée et comptabilisée');ndf()})">Valider</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">Aucune note de frais.</td></tr>'}</table></div></div>`;
}
function ndfMode(k){$('#ndfT').classList.toggle('hidden',!!k);$('#ndfK').classList.toggle('hidden',!k);$('#sgT').classList.toggle('on',!k);$('#sgK').classList.toggle('on',!!k);window._ndfKm=!!k}
async function readReceipt(f){if(!f)return;const data=await readB64(f);window._ndfFile={name:f.name,mime:f.type,data};$('#ndfDrop').innerHTML='Lecture du justificatif…';
  try{const d=await api('/api/expenses/receipt',{data,mime:f.type});if(d.date)$('#xD').value=d.date;$('#xL').value=d.label||'';if(d.ttc)$('#xT').value=d.ttc;$('#xC').value=d.category;if(d.tva_rate!=null)$('#xR').value=d.tva_rate;toast('Justificatif lu ('+d.source+') — vérifiez')}
  catch(e){}finally{$('#ndfDrop').innerHTML=`✓ ${esc(f.name)} joint<br><span class="small">cliquez pour remplacer</span>`}}
async function saveNdf(){
  const b=window._ndfKm?{date:$('#kD').value,person:$('#kP').value,label:$('#kL').value,km:+$('#kK').value,cv:+$('#kC').value}
   :{date:$('#xD').value,person:$('#xP').value,label:$('#xL').value||'Dépense',category:$('#xC').value,ttc:+$('#xT').value,tva_rate:+$('#xR').value,file:window._ndfFile};
  await api('/api/expenses',b);toast('Note de frais ajoutée');window._ndfKm=false;ndf()}
async function reimburse(){const list=await api('/api/expenses');const ids=list.filter(x=>x.status=='validee').map(x=>x.id);const r=await api('/api/expenses/reimburse',{ids,date:today()});toast(`Remboursement de ${fmt(r.total)} comptabilisé`);ndf()}

// ---------- Paie ----------
async function pay(){
  const [emps,slips]=await Promise.all([api('/api/employees'),api('/api/payslips')]);
  window._p=window._p||new Date().toISOString().slice(0,7);
  $('#view').innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><h2>Paie du mois</h2><input type="month" value="${window._p}" onchange="window._p=this.value;pay()"></div>
   <div class="row wr"><button class="b" onclick="runPay()">Calculer et comptabiliser les bulletins</button><button class="g" onclick="paySal()">Virer les salaires</button>
   <button class="g" onclick="download('/api/dsn?period=${window._p}&download=1')">Fichier DSN</button><button class="g" onclick="dsnSubmit()">Transmettre la DSN</button></div>
   <p class="muted small">Taux de cotisations 2026 paramétrés dans <code>compta/payroll.py</code>, à vérifier sur urssaf.fr. DSN au format NEODeS : à contrôler avec DSN-Val avant dépôt sur net-entreprises.fr.</p><div id="declOut"></div></div>
  <div class="card"><div class="row" style="justify-content:space-between"><h2>Bulletins</h2>${exportBtns('paie')}</div><div class="scroll"><table><tr><th>Période</th><th>Salarié</th><th class="n">Brut</th><th class="n">PAS</th><th class="n">Net à payer</th><th class="n">Coût employeur</th><th></th></tr>
   ${slips.map(s=>`<tr><td>${s.period}</td><td>${esc(s.salarie)}</td><td class="n">${fmt(s.brut)}</td><td class="n">${fmt(s.pas)}</td><td class="n"><b>${fmt(s.net_a_payer)}</b></td><td class="n">${fmt(s.cout)}</td><td><button class="g small" onclick="openFile('/api/payslips/${s.id}/pdf')">Bulletin PDF</button></td></tr>`).join('')||'<tr><td colspan="7" class="muted">Aucun bulletin.</td></tr>'}</table></div></div>
  <div class="card"><h2>Salariés</h2><div class="scroll"><table><tr><th>Nom</th><th>Emploi</th><th>Statut</th><th>Contrat</th><th class="n">Brut mensuel</th><th>Entrée</th><th></th></tr>
   ${emps.map(e=>`<tr><td>${esc(e.prenom)} ${esc(e.nom)}${e.actif?'':' <span class="tag">sorti</span>'}</td><td>${esc(e.emploi||'')}</td><td>${e.statut}</td><td>${e.contrat}</td><td class="n">${fmt(e.brut)}</td><td>${e.date_entree||''}</td><td><button class="g small wr" onclick='empForm(${JSON.stringify(e).replace(/'/g,"&#39;")})'>Modifier</button></td></tr>`).join('')||'<tr><td colspan="7" class="muted">Aucun salarié.</td></tr>'}</table></div>
   <p class="wr"><button class="g" onclick="empForm({})">+ Ajouter un salarié</button></p><div id="empF"></div></div>`;
}
function empForm(e){const f=(k,l,t='text',x='')=>`<label>${l}<input id="e_${k}" type="${t}" value="${esc(e[k]??'')}" ${x}></label>`;
  $('#empF').innerHTML=`<div class="card"><h3 style="margin-top:0">${e.id?'Modifier':'Nouveau'} salarié</h3><div class="form">${f('prenom','Prénom')}${f('nom','Nom')}${f('nir','N° de sécurité sociale')}${f('naissance','Naissance','date')}
   ${f('emploi','Emploi')}<label>Statut<select id="e_statut"><option ${e.statut=='non-cadre'?'selected':''}>non-cadre</option><option ${e.statut=='cadre'?'selected':''}>cadre</option></select></label>
   <label>Contrat<select id="e_contrat"><option ${e.contrat=='CDI'?'selected':''}>CDI</option><option ${e.contrat=='CDD'?'selected':''}>CDD</option></select></label>
   ${f('date_entree','Date d\'entrée','date')}${f('brut','Salaire brut mensuel (€)','number','step="0.01"')}${f('heures','Heures mensuelles','number','step="0.01" placeholder="151.67"')}
   ${f('mutuelle','Mutuelle (cotisation totale/mois €)','number','step="0.01"')}${f('taux_pas','Taux PAS personnalisé (%)','number','step="0.1" placeholder="vide = taux neutre"')}
   <label>Actif<select id="e_actif"><option value="1">Oui</option><option value="0" ${e.actif===0?'selected':''}>Non (sorti)</option></select></label></div>
   <p class="row"><button class="b" onclick="saveEmp(${e.id||0})">Enregistrer</button><button class="g" onclick="simEmp()">Simuler un bulletin</button></p><div id="simOut"></div></div>`;$('#empF').scrollIntoView({behavior:'smooth'})}
const EMPK=['prenom','nom','nir','naissance','emploi','statut','contrat','date_entree','brut','heures','mutuelle','taux_pas','actif'];
const empVals=()=>{const o={};EMPK.forEach(k=>{o[k]=$('#e_'+k).value});o.actif=+o.actif;o.heures=+o.heures||151.67;return o};
async function saveEmp(id){await api('/api/employees',{...empVals(),id:id||undefined});toast('Salarié enregistré');pay()}
async function simEmp(){const v=empVals();const b=await api('/api/payroll/simulate',{...v,brut:+v.brut,mutuelle:+v.mutuelle,taux_pas:v.taux_pas===''?null:+v.taux_pas,period:window._p});
  $('#simOut').innerHTML=`<div class="grid kpis">${[['Brut',b.brut],['Cotisations salariales',b.total_salarial],['Net avant impôt',b.net_social],['Prélèvement à la source',b.pas],['Net à payer',b.net_a_payer],['Coût employeur',b.cout_employeur]].map(([l,v])=>`<div class="card kpi"><div class="l">${l}</div><div class="v">${fmt(v)}</div></div>`).join('')}</div><p class="muted small">${esc(b.avertissement)}</p>`}
async function runPay(){const r=await api('/api/payroll/run',{period:window._p});toast(r.length?`${r.length} bulletin(s) comptabilisé(s)`:'Bulletins déjà établis pour ce mois');pay()}
async function paySal(){await api('/api/payroll/pay',{period:window._p,date:today()});toast('Virement des salaires comptabilisé')}
async function dsnSubmit(){const d=await api(`/api/dsn?period=${window._p}`);if(!d.salaries)return toast('Aucun bulletin pour ce mois');declare('dsn',window._p,JSON.stringify(d))}

// ---------- Paramètres ----------
async function settings(){
  const [s,mem,log,subs]=await Promise.all([api('/api/settings'),api('/api/members'),api('/api/audit-log'),ENT.kind=='entreprise'?api('/api/edi/submissions'):[]]);
  const e=s.entity,v=s.settings,isE=ENT.kind=='entreprise',own=ROLE=='proprietaire';
  const inp=(k,l,val,t='text',x='')=>`<label>${l}<input id="s_${k}" type="${t}" value="${esc(val??'')}" ${x}></label>`;
  const sel=(k,l,val,opts)=>`<label>${l}<select id="s_${k}">${opts.map(([o,t])=>`<option value="${o}" ${o==val?'selected':''}>${t}</option>`).join('')}</select></label>`;
  $('#view').innerHTML=`<div class="card"><h2>Dossier</h2><div class="form">${inp('name','Nom',e.name)}${isE?inp('siret','SIRET',e.siret)+inp('address','Adresse',e.address)+inp('email','E-mail de l\'entreprise',e.email,'email')
   +sel('legal_form','Forme juridique',e.legal_form,['SASU','SAS','SARL','EURL','EI','Micro-entreprise'].map(x=>[x,x]))
   +sel('tva_regime','Régime de TVA',e.tva_regime,[['reel','Réel (CA3)'],['franchise','Franchise en base']])
   +sel('tva_exigibilite','Exigibilité de la TVA (services)',e.tva_exigibilite||'debits',[['encaissements','Sur les encaissements'],['debits','Sur les débits (option)']])
   +inp('effectif','Effectif salarié',v.effectif,'number')+inp('atmp','Taux AT/MP (%)',v.atmp,'number','step="0.01" placeholder="0.80"'):''}</div>
   <p class="wr"><button class="b" onclick="saveSettings()">Enregistrer</button></p></div>
  ${isE?`<div class="card"><h2>E-mail (relances et devis)</h2><div class="form">${inp('smtp_host','Serveur SMTP',v.smtp_host,'text','placeholder="smtp.exemple.fr"')}${inp('smtp_port','Port',v.smtp_port,'number','placeholder="587"')}
   ${sel('smtp_security','Sécurité',v.smtp_security||'starttls',[['starttls','STARTTLS'],['ssl','SSL/TLS'],['none','Aucune']])}${inp('smtp_user','Identifiant',v.smtp_user)}${inp('smtp_password','Mot de passe',v.smtp_password,'password')}${inp('smtp_from','Expéditeur',v.smtp_from,'email')}</div>
   <p class="wr"><button class="b" onclick="saveSettings()">Enregistrer</button></p></div>
  <div class="card"><h2>Télédéclaration (partenaire EDI)</h2>
   <p class="muted small">La DGFiP n'accepte les dépôts automatiques de TVA, de liasse et d'IS que via un <b>partenaire EDI agréé</b> (liste officielle sur impots.gouv.fr). Une fois le contrat signé, renseignez l'URL d'API et le jeton fournis. Le mode « Simulation » permet de tester tout le parcours sans rien envoyer.</p>
   <div class="form">${sel('edi_mode','Mode',v.edi_mode||'off',[['off','Désactivé (saisie manuelle)'],['sandbox','Simulation (test)'],['http','Partenaire EDI (production)']])}${inp('edi_partenaire','Nom du partenaire',v.edi_partenaire)}
   ${inp('edi_url','URL de l\'API (https://…)',v.edi_url)}${inp('edi_token','Jeton d\'accès',v.edi_token,'password')}${sel('edi_test','Envoi',v.edi_test??'1',[['1','Environnement de test du partenaire'],['0','Production (dépôt réel)']])}</div>
   <p class="row wr"><button class="b" onclick="saveSettings()">Enregistrer</button><button class="g" onclick="api('/api/edi/test',{}).then(r=>toast((r.ok?'✓ ':'⚠ ')+r.message))">Tester la connexion</button></p>
   <h3>Historique des envois</h3><div class="scroll"><table><tr><th>Date</th><th>Type</th><th>Mode</th><th>Référence</th><th>Statut</th><th></th></tr>
   ${subs.map(x=>`<tr><td>${x.created}</td><td>${x.type}</td><td>${x.mode}</td><td><code>${esc(x.ref||'—')}</code></td><td><span class="tag ${x.status=='accepte'?'ok':x.status=='rejete'||x.status=='erreur'?'bad':'warn'}">${x.status}</span><div class="small muted">${esc(x.response?.message||'')}</div></td>
   <td>${x.ref&&x.mode=='http'?`<button class="g small" onclick="api('/api/edi/${x.id}/refresh',{}).then(()=>settings())">Actualiser</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="muted">Aucun envoi.</td></tr>'}</table></div></div>`:''}
  <div class="card"><h2>Membres du dossier</h2><p class="muted small"><b>Propriétaire</b> : tout, y compris les membres. <b>Comptable</b> : saisie, validation, déclarations, clôture. <b>Lecteur</b> : consultation et exports (banquier, associé…).</p>
   <div class="scroll"><table><tr><th>Nom</th><th>E-mail</th><th>Rôle</th><th></th></tr>${mem.map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.email)}</td><td><span class="tag acc">${m.role}</span></td>
   <td>${own&&m.id!=ME.id?`<button class="g small" onclick="if(confirm('Retirer ce membre ?'))api('/api/members/${m.id}/delete',{}).then(settings)">Retirer</button>`:''}</td></tr>`).join('')}</table></div>
   ${own?`<h3>Inviter</h3><div class="form"><label>E-mail<input id="mE" type="email"></label><label>Nom<input id="mN"></label><label>Rôle<select id="mR"><option value="comptable">Comptable</option><option value="lecteur">Lecteur</option><option value="proprietaire">Propriétaire</option></select></label><button class="b" onclick="invite()">Inviter</button></div><div id="mOut"></div>`:''}</div>
  <div class="card"><h2>Journal d'audit</h2><p class="muted small">Toutes les modifications, horodatées et attribuées (piste d'audit fiable).</p><div class="scroll" style="max-height:360px;overflow:auto"><table><tr><th>Date (UTC)</th><th>Utilisateur</th><th>Action</th></tr>
   ${log.map(l=>`<tr><td>${l.at}</td><td>${esc(l.email||'—')}</td><td>${esc(l.action)}${l.detail?' — '+esc(l.detail):''}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">—</td></tr>'}</table></div></div>`;
}
async function saveSettings(){const g=k=>{const el=$('#s_'+k);return el?el.value:undefined};
  const entity={};['name','siret','address','email','legal_form','tva_regime','tva_exigibilite'].forEach(k=>{if(g(k)!==undefined)entity[k]=g(k)});
  const st={};['effectif','atmp','smtp_host','smtp_port','smtp_security','smtp_user','smtp_password','smtp_from','edi_mode','edi_partenaire','edi_url','edi_token','edi_test'].forEach(k=>{if(g(k)!==undefined)st[k]=g(k)});
  await api('/api/settings',{entity,settings:st});toast('Paramètres enregistrés');ENTS=await api('/api/entities');ENT=ENTS.find(e=>e.id==ENT.id);settings()}
async function invite(){const r=await api('/api/members',{email:$('#mE').value,name:$('#mN').value,role:$('#mR').value});
  $('#mOut').innerHTML=r.mot_de_passe_provisoire?`<div class="al attention">Compte créé pour ${esc(r.email)}. ${r.email_envoye?'Invitation envoyée par e-mail.':'E-mail non configuré : transmettez-lui ce mot de passe provisoire (affiché une seule fois) : <code>'+esc(r.mot_de_passe_provisoire)+'</code>'}</div>`:'';
  toast('Membre ajouté');if(!r.mot_de_passe_provisoire||r.email_envoye)settings()}

window.addEventListener('unhandledrejection',e=>e.preventDefault()); // erreurs déjà affichées par toast()
</script>
<script src="v2.js"></script>
</body>
